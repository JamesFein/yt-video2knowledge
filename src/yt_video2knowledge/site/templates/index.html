{% extends "base.html" %}

{% block title %}日期 - Knowledge Site{% endblock %}

{% block content %}
  <section class="page-heading">
    <h1>日期</h1>
    <p>按日期整理的视频摘要。</p>
  </section>

  {% if days %}
    <section class="day-list" aria-label="日期归档">
      {% for day in days %}
        <article class="day-row">
          <div class="row-main">
            <a class="row-title" href="/days/{{ day.day_date }}">{{ day.day_date }}</a>
          </div>
          <span class="count">{{ day.video_count }} 个视频</span>
        </article>
      {% endfor %}
    </section>
  {% else %}
    <p class="empty">暂无已同步日期。</p>
  {% endif %}
{% endblock %}
