[project]
name = "youtube-knowledge-digest"
version = "0.1.0"
description = "Local-first YouTube playlist digest workflow for macOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "mlx-whisper",
  "playwright",
  "httpx",
  "google-auth",
  "google-auth-oauthlib",
  "google-api-python-client",
  "itsdangerous",
  "jinja2",
  "uvicorn",
]

[tool.uv]
package = false
