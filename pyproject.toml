[project]
name = "yt-video2knowledge"
version = "0.1.0"
description = "Local-first YouTube playlist digest workflow for macOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "mlx-whisper",
  "playwright",
  "httpx",
  "google-auth",
  "google-auth-oauthlib",
  "google-api-python-client",
  "itsdangerous",
  "jinja2",
  "uvicorn",
  "opencc-python-reimplemented>=0.1.7",
]

[project.scripts]
yt-video2knowledge = "yt_video2knowledge.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_video2knowledge"]
